<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC PC-Manager – Präsentationsumsatz</title><style>body{margin:0;background:#091725;color:#eef5fb;font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{background:#6b4b0c;color:#ffe8a3;padding:7px 10px;border-radius:999px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;margin:16px 0}.kpi,.card{background:#102b43;border:1px solid #315873;border-radius:14px;padding:14px}.kpi small{color:#a9c2d4}.kpi b{display:block;font-size:24px;margin-top:5px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.card h3{margin:0 0 10px}.bars{display:grid;gap:7px}.barrow{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center}.track{height:12px;background:#07111c;border-radius:8px;overflow:hidden}.fill{height:100%;background:#2f9e5b}.muted{color:#a9c2d4}.top{display:grid;gap:7px}.top div{display:flex;justify-content:space-between;border-bottom:1px solid #29465b;padding-bottom:5px}.actions a,.actions button{display:inline-block;border:0;border-radius:9px;padding:10px 12px;margin-left:6px;font-weight:800;text-decoration:none;cursor:pointer}.actions a{background:#2869a6;color:white}.actions button{background:#1f7a46;color:white}.empty{padding:30px;text-align:center;background:#3f2e0a;border-radius:12px}.foot{margin-top:12px;font-size:12px;color:#91aabd}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.barrow{grid-template-columns:105px 1fr 75px}.kpi b{font-size:20px}}</style></head><body><main class="wrap"><div class="head"><div><div class="badge">PRÄSENTATIONSDATEN · 04.09.2026</div><h1>KC MarktKasse – Umsatz-Dashboard</h1><div class="muted" id="period"></div></div><div class="actions"><a href="presentation-demo.html">Demodaten verwalten</a><button onclick="render()">Aktualisieren</button></div></div><section id="app"></section><div class="foot">Alle Werte auf dieser Seite stammen ausschließlich aus dem markierten Demo-Batch PRAESENTATION-2026-09-04. Echte Buchungen werden nicht in diese Präsentationsauswertung einbezogen.</div></main><script>const TX='kc_transactions_v040',BATCH='PRAESENTATION-2026-09-04';const euro=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});function rows(){try{return(JSON.parse(localStorage.getItem(TX)||'[]')||[]).filter(x=>x&&x.demoBatchId===BATCH)}catch{return[]}}function add(o,k,v){o[k]=(o[k]||0)+v}function stats(){const r=rows(),day={},hour={},prod={},cat={},reg={},op={};let rev=0,items=0,pfand=0,ret=0,min=null,max=null;for(const t of r){const due=Number(t.due??t.total??0);rev+=due;const dt=new Date(t.endTime||t.time||t.startTime);if(!isNaN(dt)){add(day,dt.toLocaleDateString('de-DE'),due);add(hour,String(dt.getHours()).padStart(2,'0')+':00',due);const ms=dt.getTime();min=min===null?ms:Math.min(min,ms);max=max===null?ms:Math.max(max,ms)}add(reg,t.registerName||t.registerId||'Kasse',due);add(op,t.operator||'Unbekannt',due);for(const i of(t.items||[])){const q=Number(i.qty||0),line=Number(i.lineTotal??Number(i.price||0)*q);items+=Math.max(0,q);add(prod,i.name||i.id||'Artikel',line);add(cat,i.category||'Sonstiges',line);if(i.category==='Pfand'||/pfand/i.test(i.name||'')){if(line<0)ret+=Math.abs(line);else pfand+=line}}}return{r,rev,avg:r.length?rev/r.length:0,items,pfand,ret,day,hour,prod,cat,reg,op,min,max}}function sorted(o){return Object.entries(o).sort((a,b)=>b[1]-a[1])}function bars(title,o,limit=20){const a=sorted(o).slice(0,limit),m=Math.max(1,...a.map(x=>Math.abs(x[1])));return`<div class="card"><h3>${title}</h3><div class="bars">${a.map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="track"><div class="fill" style="width:${Math.max(2,Math.abs(v)/m*100)}%"></div></div><b>${euro(v)}</b></div>`).join('')}</div></div>`}function top(title,o){return`<div class="card"><h3>${title}</h3><div class="top">${sorted(o).slice(0,8).map(([k,v],i)=>`<div><span>${i+1}. ${k}</span><b>${euro(v)}</b></div>`).join('')}</div></div>`}function render(){const s=stats(),app=document.getElementById('app');document.getElementById('period').textContent=s.min?`Zeitraum: ${new Date(s.min).toLocaleString('de-DE')} – ${new Date(s.max).toLocaleString('de-DE')}`:'Keine Präsentationsdaten geladen';if(!s.r.length){app.innerHTML='<div class="empty"><h2>Noch keine 8.000 Demo-Bons geladen</h2><p>Öffne „Demodaten verwalten“ und wähle „8.000 Demo-Bons einsetzen“.</p></div>';return}app.innerHTML=`<div class="kpis"><div class="kpi"><small>Umsatz</small><b>${euro(s.rev)}</b></div><div class="kpi"><small>Bons</small><b>${s.r.length.toLocaleString('de-DE')}</b></div><div class="kpi"><small>Ø Bon</small><b>${euro(s.avg)}</b></div><div class="kpi"><small>Artikelmenge</small><b>${Math.round(s.items).toLocaleString('de-DE')}</b></div><div class="kpi"><small>Pfand / Rückgabe</small><b>${euro(s.pfand)} / ${euro(s.ret)}</b></div></div><div class="grid"><div>${bars('Umsatz nach Tag',s.day,14)}</div><div>${top('Top-Artikel nach Umsatz',s.prod)}</div><div>${bars('Umsatz nach Stunde',s.hour,24)}</div><div>${top('Warengruppen',s.cat)}</div><div>${bars('Umsatz nach Kasse',s.reg,8)}</div><div>${top('Bediener',s.op)}</div></div>`}window.addEventListener('storage',e=>{if(e.key===TX)render()});render();</script></body></html>
