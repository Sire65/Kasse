name: Marktstart 2026 Reset Regression

on:
  push:
    branches: [main]
    paths:
      - 'market-start-reset/**'
      - 'pc-manager/index.html'
      - 'pos/index.html'
      - 'money-butler/index.html'
      - 'tests/market-start-reset.test.cjs'
      - '.github/workflows/market-start-reset-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'market-start-reset/**'
      - 'pc-manager/index.html'
      - 'pos/index.html'
      - 'money-butler/index.html'
      - 'tests/market-start-reset.test.cjs'
      - '.github/workflows/market-start-reset-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check market-start-reset/app.js
      - name: Marktstart reset protection
        run: node tests/market-start-reset.test.cjs
