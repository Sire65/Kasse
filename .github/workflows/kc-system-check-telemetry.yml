name: KC System Check Telemetrie TÜV
on:
  pull_request:
    paths:
      - 'pc-manager/kc-datenfluss-melder.js'
      - 'pc-manager/kc-live-monitor.js'
      - 'pc-manager/index.html'
      - 'pos/kc-sync-live-event.js'
      - 'tests/kc-system-check-telemetry.test.mjs'
      - '.github/workflows/kc-system-check-telemetry.yml'
permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax PC Manager telemetry
        run: node --check pc-manager/kc-datenfluss-melder.js
      - name: Regression real traffic contract
        run: node --test tests/kc-system-check-telemetry.test.mjs
