name: Money Butler Transfer Regression

on:
  push:
    branches: [ main ]
    paths:
      - 'money-butler/**'
      - 'pc-manager/**'
      - 'pos/**'
      - 'schulung/pos/**'
      - 'markt-kasse-suite/backend-source/manager-companion/**'
      - 'tests/money-butler-*.test.cjs'
      - '.github/workflows/money-butler-transfer-regression.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'money-butler/**'
      - 'pc-manager/**'
      - 'pos/**'
      - 'schulung/pos/**'
      - 'markt-kasse-suite/backend-source/manager-companion/**'
      - 'tests/money-butler-*.test.cjs'
      - '.github/workflows/money-butler-transfer-regression.yml'

jobs:
  transfer-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Money Butler Konsolidierung
        run: node tests/money-butler-consolidation.test.cjs
      - name: Money Butler Communicator route
        run: node tests/money-butler-communicator-route.test.cjs
      - name: Money Butler complete transfer paths
        run: node tests/money-butler-complete-paths.test.cjs
      - name: Confirmation and push route
        run: node tests/money-butler-confirmation-push.test.cjs
      - name: Finance confirmation retry
        run: node tests/money-butler-finance-retry.test.cjs
      - name: Finance Später and Übernehmen
        run: node tests/money-butler-finance-spaeter.test.cjs
      - name: Confirmation push retry and dedup
        run: node tests/money-butler-push-dedup.test.cjs
      - name: PC Manager Money Butler integration
        run: node tests/money-butler-manager-integration.test.cjs
      - name: Late count and coin weighing
        run: node tests/money-butler-late-count-weighing.test.cjs
      - name: Money Butler syntax
        run: |
          node --check money-butler/app.js
          node --check money-butler/kc-auth.js
          node --check money-butler/kc-communicator-bridge.js
          node --check shared/kc-cash-measure-settings.js
          node --check shared/kc-closing-count-ui.js
          node --check pc-manager/kc-money-butler-cloud-intake.js
          node --check pc-manager/kc-cash-measure-central-sync.js
          node --check shared/kc-cash-measure-settings.js
          node --check shared/kc-closing-count-ui.js
          node --check pos/kc-sync-master-data.js
          node --check schulung/pos/kc-sync-master-data.js
          node --check markt-kasse-suite/backend-source/manager-companion/index.js
          node --check markt-kasse-suite/backend-source/manager-companion/db.js


  windows-bundle:
    needs: transfer-regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend Laufzeitmodule
        shell: pwsh
        run: |
          Set-Location markt-kasse-suite/backend-source
          npm install --omit=dev --no-audit --no-fund

      - name: Backend Integration
        shell: pwsh
        run: |
          Set-Location markt-kasse-suite/backend-source
          npm test

      - name: Start-Smoke-Test
        shell: pwsh
        run: |
          node --check markt-kasse-suite/backend-source/run-manager-service.js
          node --check markt-kasse-suite/backend-source/serve-frontend.js
          $p = Start-Process node -ArgumentList @('markt-kasse-suite/backend-source/run-manager-service.js','--port','18543','--webserver-port','18090') -PassThru -RedirectStandardOutput manager-start.log -RedirectStandardError manager-start.err
          try {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18090/pc-manager/index.html' -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              if ($p.HasExited) { break }
            }
            Get-Content manager-start.log -ErrorAction SilentlyContinue
            Get-Content manager-start.err -ErrorAction SilentlyContinue
            if (-not $ok) { throw 'PC-Manager im integrierten Starttest nicht erreichbar.' }
            foreach ($url in @('http://127.0.0.1:18090/pos/index.html','http://127.0.0.1:18090/money-butler/index.html')) {
              $r = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 5
              if ($r.StatusCode -ne 200) { throw "Nicht erreichbar: $url" }
            }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Windows Komplettpaket
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KC_MarktKasse_Komplett'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Force $env:GITHUB_WORKSPACE |
            Where-Object { $_.Name -notin @('.git','.github') } |
            Copy-Item -Destination $stage -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'runtime') | Out-Null
          Copy-Item (Get-Command node).Source (Join-Path $stage 'runtime\node.exe') -Force
          @"
KC MarktKasse Windows-Komplettpaket
GitHub Commit: $env:GITHUB_SHA
Portable Node: enthalten
Backend node_modules: enthalten
Start: KC_Manager_Start.cmd
"@ | Set-Content -Encoding UTF8 (Join-Path $stage 'PAKET_STAND.txt')
          $zip = Join-Path $env:RUNNER_TEMP 'KC_MarktKasse_Windows_Komplett.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          "BUNDLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: KC-MarktKasse-Windows-Komplett
          path: ${{ env.BUNDLE_ZIP }}
          retention-days: 7
          if-no-files-found: error
