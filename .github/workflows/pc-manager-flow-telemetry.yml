name: PC Manager Real Flow Telemetry TÜV
on:
  pull_request:
    paths:
      - 'pc-manager/kc-manager-supabase-status.js'
      - 'tests/pc-manager-flow-telemetry.test.cjs'
      - '.github/workflows/pc-manager-flow-telemetry.yml'
permissions:
  contents: read

jobs:
  pc-manager-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax
        run: node --check pc-manager/kc-manager-supabase-status.js
      - name: Regression real PC Manager flow
        run: node --test tests/pc-manager-flow-telemetry.test.cjs
