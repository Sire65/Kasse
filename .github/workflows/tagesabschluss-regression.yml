name: Tagesabschluss Regression und TÜV

on:
  push:
    branches: [ main ]
    paths:
      - 'pos/**'
      - 'money-butler/**'
      - 'pc-manager/**'
      - 'tests/tagesabschluss-system.test.cjs'
      - '.github/workflows/tagesabschluss-regression.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pos/**'
      - 'money-butler/**'
      - 'pc-manager/**'
      - 'tests/tagesabschluss-system.test.cjs'
      - '.github/workflows/tagesabschluss-regression.yml'
  workflow_dispatch:

jobs:
  tagesabschluss-tuev:
    runs-on: ubuntu-latest
    steps:
      - name: Kasse auschecken
        uses: actions/checkout@v4
        with:
          path: Kasse

      - name: Externe Repos laden
        run: |
          mkdir -p KC-Verwaltung/js KC-Communication/supabase/functions/kc-finance-bridge
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/Sire65/KC-Verwaltung/main/index.html -o KC-Verwaltung/index.html
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/Sire65/KC-Verwaltung/main/js/86_finance_closing_reports.js -o KC-Verwaltung/js/86_finance_closing_reports.js
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/Sire65/KC-Communication/main/supabase/functions/kc-finance-bridge/index.ts -o KC-Communication/supabase/functions/kc-finance-bridge/index.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kasse und PC Manager Regression
        working-directory: Kasse
        run: node tests/tagesabschluss-system.test.cjs

      - name: KC Verwaltung Integration
        run: |
          grep -q 'js/86_finance_closing_reports.js?v=1.0.0' KC-Verwaltung/index.html
          grep -q "closing_report_list" KC-Verwaltung/js/86_finance_closing_reports.js
          grep -q "closing_report_mark_imported" KC-Verwaltung/js/86_finance_closing_reports.js
          grep -q "Gesamt Soll" KC-Verwaltung/js/86_finance_closing_reports.js
          grep -q "Gesamt Ist" KC-Verwaltung/js/86_finance_closing_reports.js
          grep -q "Differenz" KC-Verwaltung/js/86_finance_closing_reports.js

      - name: Finance Bridge Integration
        run: |
          grep -q "action==='closing_report_upsert'" KC-Communication/supabase/functions/kc-finance-bridge/index.ts
          grep -q "onConflict:'correlation_id'" KC-Communication/supabase/functions/kc-finance-bridge/index.ts
          grep -q "closing_report_list" KC-Communication/supabase/functions/kc-finance-bridge/index.ts
          grep -q "closing_report_mark_imported" KC-Communication/supabase/functions/kc-finance-bridge/index.ts
          grep -q "adminRole(link)" KC-Communication/supabase/functions/kc-finance-bridge/index.ts

      - name: TÜV Schutzregeln
        run: |
          grep -q "status:\"fertig\"" Kasse/pos/app.js
          grep -q "kc_closings_gemeldet_v1" Kasse/pos/app.js
          grep -q "closingBusinessDate(x)===tag" Kasse/pc-manager/app.js
          ! grep -q "kc-finance-uebergaben.js?build=1.0.0" Kasse/pc-manager/index.html
