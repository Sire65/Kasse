name: Tagesabschluss Regression und TÜV

on:
  push:
    branches: [ main ]
    paths:
      - 'pos/**'
      - 'schulung/pos/**'
      - 'money-butler/**'
      - 'pc-manager/**'
      - 'tests/tagesabschluss-system.test.cjs'
      - '.github/workflows/tagesabschluss-regression.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pos/**'
      - 'schulung/pos/**'
      - 'money-butler/**'
      - 'pc-manager/**'
      - 'tests/tagesabschluss-system.test.cjs'
      - '.github/workflows/tagesabschluss-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagesabschluss-tuev:
    runs-on: ubuntu-latest
    steps:
      - name: Kasse auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: Kasse

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Kasse und PC Manager Regression
        working-directory: Kasse
        run: node tests/tagesabschluss-system.test.cjs

      - name: Money Butler Konsolidierung
        working-directory: Kasse
        run: node tests/money-butler-consolidation.test.cjs

      - name: JavaScript Syntaxprüfung
        run: |
          node --check Kasse/money-butler/kc-auth.js
          node --check Kasse/pc-manager/kc-tagesabschluss-zentrale.js
          node --check Kasse/pc-manager/kc-abschluesse-manager.js
          node --check Kasse/pc-manager/kc-finance-bridge.js

      - name: TÜV Schutzregeln
        run: |
          grep -q "status:\"fertig\"" Kasse/pos/app.js
          grep -q "kc_closings_gemeldet_v1" Kasse/pos/app.js
          grep -q "closingBusinessDate(x)===tag" Kasse/pc-manager/app.js
          ! grep -q "kc-finance-uebergaben.js?build=1.0.0" Kasse/pc-manager/index.html
