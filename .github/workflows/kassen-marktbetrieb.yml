name: Kassen-Marktbetrieb
on:
  pull_request:
    paths: ['tests/time-clock-cloud-queue.test.cjs', 'tests/time-clock-auth-relay.test.cjs', 'tests/time-clock-booking-browser.test.cjs', 'markt-kasse-suite/backend-source/manager-companion/**', 'money-butler/**', 'pc-manager/**', 'schulung/money-butler/**', 'schulung/pc-manager/**', 'tests/kassen-programmverbund.test.cjs', 'pos/**', 'schulung/pos/**', 'tests/marktbetrieb.test.cjs', 'tests/verkaufskurve-prognose.test.cjs', 'tests/haendlerausweis.test.cjs', 'tests/kasse-sparsam.test.cjs', 'tests/kasse-leitung.test.cjs', 'shared/kc-direkte-leitung.js', 'markt-kasse-suite/backend-source/stand-bruecke.js', 'supabase/migrations/**', '.github/workflows/kassen-marktbetrieb.yml']
  push:
    branches: [main]
    paths: ['tests/time-clock-cloud-queue.test.cjs', 'tests/time-clock-auth-relay.test.cjs', 'tests/time-clock-booking-browser.test.cjs', 'markt-kasse-suite/backend-source/manager-companion/**', 'money-butler/**', 'pc-manager/**', 'schulung/money-butler/**', 'schulung/pc-manager/**', 'tests/kassen-programmverbund.test.cjs', 'pos/**', 'schulung/pos/**', 'tests/marktbetrieb.test.cjs', 'tests/verkaufskurve-prognose.test.cjs', 'tests/kasse-sparsam.test.cjs', 'tests/kasse-leitung.test.cjs', 'shared/kc-direkte-leitung.js', 'markt-kasse-suite/backend-source/stand-bruecke.js', 'supabase/migrations/**', '.github/workflows/kassen-marktbetrieb.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  betrieb:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Marktbetrieb und Händlerausweise in beiden Kassen
        run: |
          node tests/dp2-program-publication.test.cjs
          node tests/rezepte-supabase-anmeldung.test.cjs
          node tests/feuerzange-ausgabeteil.test.cjs
          node tests/rahmenprogramm-2026.test.cjs
          node tests/time-clock-auth-relay.test.cjs
          node tests/time-clock-cloud-queue.test.cjs
          node tests/kasse-sparsam.test.cjs
          node tests/kasse-leitung.test.cjs
          node tests/direkte-leitung.test.cjs
          node tests/time-clock-booking-browser.test.cjs
          node tests/marktbetrieb.test.cjs
          node tests/haendlerausweis.test.cjs
          node tests/verkaufskurve-prognose.test.cjs
      - name: Geldwege und ruhige Abschlussmeldungen
        run: |
          node tests/kassen-programmverbund.test.cjs
          node tests/money-butler-finance-retry.test.cjs
          node tests/money-butler-finance-spaeter.test.cjs
          node tests/money-butler-complete-paths.test.cjs
          node tests/tagesabschluss-system.test.cjs
          node tests/kasse-pruefung-08-10.test.cjs
          node tests/gutschein-teilzahlung.test.cjs
          node tests/meldung-schliesst-selbst.test.cjs
