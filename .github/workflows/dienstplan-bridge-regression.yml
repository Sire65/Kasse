name: Dienstplan Bridge Regression

on:
  push:
    branches: [main]
    paths:
      - 'pc-manager/kc-dienstplan-manager.js'
      - 'pos/kc-dienstplan-kasse.js'
      - 'pos/index.html'
      - 'pos/service-worker.js'
      - 'schulung/pos/kc-dienstplan-kasse.js'
      - 'schulung/pos/index.html'
      - 'schulung/pos/service-worker.js'
      - 'markt-kasse-suite/backend-source/device-companion/**'
      - 'markt-kasse-suite/backend-source/manager-companion/**'
      - 'tests/dienstplan-pc-manager-v3.test.cjs'
      - '.github/workflows/dienstplan-bridge-regression.yml'
  pull_request:
    paths:
      - 'pc-manager/kc-dienstplan-manager.js'
      - 'pos/kc-dienstplan-kasse.js'
      - 'pos/index.html'
      - 'pos/service-worker.js'
      - 'schulung/pos/kc-dienstplan-kasse.js'
      - 'schulung/pos/index.html'
      - 'schulung/pos/service-worker.js'
      - 'markt-kasse-suite/backend-source/device-companion/**'
      - 'markt-kasse-suite/backend-source/manager-companion/**'
      - 'tests/dienstplan-pc-manager-v3.test.cjs'
      - '.github/workflows/dienstplan-bridge-regression.yml'

permissions:
  contents: read

jobs:
  pc-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tests/dienstplan-pc-manager-v3.test.cjs

  companions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markt-kasse-suite/backend-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node tests/dienstplan-bridge-v3.test.cjs
