name: Dienstplan Bridge Regression

on:
  pull_request:
    paths:
      - 'pc-manager/kc-dienstplan-manager.js'
      - 'pos/kc-dienstplan-kasse.js'
      - 'schulung/pos/kc-dienstplan-kasse.js'
      - 'markt-kasse-suite/backend-source/device-companion/**'
      - 'markt-kasse-suite/backend-source/manager-companion/**'
      - 'tests/dienstplan-pc-manager-v2.test.cjs'
      - '.github/workflows/dienstplan-bridge-regression.yml'
  push:
    branches: [main]
    paths:
      - 'pc-manager/kc-dienstplan-manager.js'
      - 'pos/kc-dienstplan-kasse.js'
      - 'schulung/pos/kc-dienstplan-kasse.js'
      - 'markt-kasse-suite/backend-source/device-companion/**'
      - 'markt-kasse-suite/backend-source/manager-companion/**'
      - 'tests/dienstplan-pc-manager-v2.test.cjs'
      - '.github/workflows/dienstplan-bridge-regression.yml'

jobs:
  pc-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PC-Manager Eventfilter und Pseudonyme
        run: node tests/dienstplan-pc-manager-v2.test.cjs

  companions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markt-kasse-suite/backend-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend-Abhaengigkeiten
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Persistenz, Revision und Offline-Fallback
        run: node tests/dienstplan-bridge-v2.test.cjs
