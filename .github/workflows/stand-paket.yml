name: Stand-Paket (Selbst-Update der Kassen-PCs)

# Nach jedem Merge auf main: stand-paket.json neu berechnen (Liste aller Programmdateien mit SHA-256).
# Die Kassen-PCs (C:\KC-Kasse) laden beim Start diese Liste von GitHub Pages und holen nur geänderte Dateien.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: stand-paket
  cancel-in-progress: false

jobs:
  paketliste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paketliste erzeugen
        run: node tools/stand-paket.js
      - name: Starter-Tests (Installation, Update, Rückfall) mit der neuen Liste
        run: node tests/kc-starter.test.cjs
      - name: Paketliste einchecken (nur wenn geändert)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- stand-paket.json; then
            echo "stand-paket.json ist aktuell."
            exit 0
          fi
          git config user.name "kc-stand-paket"
          git config user.email "kc-stand-paket@users.noreply.github.com"
          git add stand-paket.json
          git commit -m "Stand-Paket: Paketliste aktualisiert"
          git push origin HEAD:main
          # Commits mit dem Actions-Token lösen keinen neuen Pages-Lauf aus - deshalb ausdrücklich anstoßen.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages-Build konnte nicht angestoßen werden (wird beim nächsten Merge nachgeholt)."
