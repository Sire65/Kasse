<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KC Fernseher</title>
<!--
  KS-05 – Das zeigt der Fernseher am Stand (der Kassen-Start öffnet diese Seite im Edge-Kiosk).
  1. Präsentation aus dem TV-Designer („📺 An den Fernseher senden“) – eigenständiges HTML-Programm
  2. sonst die eingebaute Weihnachtsmarkt-Präsentation 2026 „Version A“ (weihnachtsmarkt-2026-version-a.html)
  3. fehlt diese: ein gesendetes TV-Paket bzw. die Weihnachtsmarkt-Präsentation des TV-Players
  Neu gesendete Programme werden binnen 30 s übernommen, ohne Neustart. Kein Mauszeiger, keine
  Bedienleiste, Bildschirm bleibt wach. Nie „Paket bitte einlesen“ vor den Kunden.
-->
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;opacity:0;transition:opacity .8s}
  iframe.sichtbar{opacity:1}
</style>
</head>
<body>
<iframe id="a" title="Präsentation" allow="autoplay; fullscreen"></iframe>
<iframe id="b" title="Präsentation" allow="autoplay; fullscreen"></iframe>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var PRUEFEN_MS = Math.max(2, Number(q.get('pruefen')) || 30) * 1000;
  // Sicherheitsrand gegen Overscan (Fernseher schneidet Ränder ab): ?rand=3 = 3 % Rand rundum.
  var RAND = Math.max(0, Math.min(10, Number(q.get('rand')) || 0));
  if (RAND) {
    var st = document.createElement('style');
    st.textContent = 'iframe{top:' + RAND + 'vh!important;left:' + RAND + 'vw!important;width:' + (100 - 2 * RAND) + 'vw!important;height:' + (100 - 2 * RAND) + 'vh!important}';
    document.head.appendChild(st);
  }
  var rahmen = [document.getElementById('a'), document.getElementById('b')];
  var aktiv = 0, stand = null, herkunft = null;

  // SPARMODUS (25.11.2026, Wunsch Betreiber „damit der TV nicht so viel Rechenleistung braucht“ – Mini-PC mit
  // Celeron N3050 lief bei 100 %): Dauer-Effekte aus (Schnee, Funken, Feuerwerk, Laser, Wetter-Animationen,
  // Unschärfe-Filter). Folienwechsel, Laufschrift/Ticker und alle Inhalte bleiben. ?spar=0 schaltet ihn ab.
  var SPAR = q.get('spar') === '1';
  function sparCss(d) {
    var weg = [];
    function regeln(liste) {
      for (var i = 0; i < liste.length; i++) {
        var r = liste[i];
        if (r.cssRules && !r.selectorText) { try { regeln(r.cssRules); } catch (e) { /* */ } continue; }
        if (!r.style || !r.selectorText) continue;
        var dauernd = /infinite/.test(r.style.animation || '') || r.style.animationIterationCount === 'infinite';
        var name = (r.style.animationName || r.style.animation || '');
        if (dauernd && !/ticker|lauf/i.test(name) && !/ticker|lauf/i.test(r.selectorText)) weg.push(r.selectorText);
      }
    }
    for (var i = 0; i < d.styleSheets.length; i++) { try { regeln(d.styleSheets[i].cssRules); } catch (e) { /* fremdes Stylesheet */ } }
    return (weg.length ? weg.join(',') + '{animation:none!important}' : '')
      + '.tvFx,.tvFireworkBurst,.tvRocketTrail,.tvWeatherScene b,.tvWeatherScene i,.tvWeatherScene em,.kcKw b,.kcKw i{display:none!important}';
  }
  // Laufschrift/Ticker: 20 Schritte je Sekunde statt 60 Bilder - gut lesbar, ein Drittel der Bildberechnung.
  // Neue Folien bringen neue Laufschriften mit - darum alle 3 s nachsehen.
  function laufschriftSparen() {
    var f = rahmen[aktiv]; if (!SPAR || !f) return;
    try {
      var liste = f.contentDocument && f.contentDocument.getAnimations ? f.contentDocument.getAnimations() : [];
      for (var i = 0; i < liste.length; i++) {
        var a = liste[i], name = a.animationName || '';
        if (a.kcSpar || !/ticker|lauf/i.test(name) || !a.effect) continue;
        var dauer = Number(a.effect.getTiming().duration) || 0;
        if (dauer > 0) a.effect.updateTiming({ easing: 'steps(' + Math.max(10, Math.round(dauer / 1000 * 20)) + ')' });
        a.kcSpar = true;
      }
    } catch (e) { /* fremde Herkunft */ }
  }
  if (SPAR) setInterval(laufschriftSparen, 3000);

  // In der eingebetteten Präsentation: Mauszeiger und Bedienleiste (‹ Pause ›) ausblenden, im Sparmodus Effekte aus.
  function aufraeumen(f) {
    try {
      var d = f.contentDocument; if (!d || !d.head) return;
      var s = d.createElement('style');
      s.textContent = '*{cursor:none!important}.controls,#control,#tvControls,#tvBigDone,#kcBuildLabel{display:none!important}';
      d.head.appendChild(s);
      if (SPAR) {
        var sp = d.createElement('style'); sp.id = 'kcSparmodus'; sp.textContent = sparCss(d); d.head.appendChild(sp);
        document.documentElement.dataset.spar = '1';
      }
    } catch (e) { /* fremde Herkunft - nichts zu tun */ }
  }

  function zeige(url, neueHerkunft) {
    var naechster = rahmen[1 - aktiv], alter = rahmen[aktiv];
    naechster.onload = function () {
      aufraeumen(naechster);
      naechster.classList.add('sichtbar'); alter.classList.remove('sichtbar');
      setTimeout(function () { alter.removeAttribute('src'); }, 1200);
      aktiv = 1 - aktiv; herkunft = neueHerkunft;
      document.documentElement.dataset.herkunft = neueHerkunft;
    };
    naechster.src = url;
  }

  // Eingebaute Präsentation, solange nichts gesendet wurde: Weihnachtsmarkt 2026 „Version A“
  // (Sieger der Mitglieder-Umfrage). Fehlt die Datei oder wird ?eingebaut=player verlangt,
  // läuft wie bisher der TV-Player.
  var VERSION_A = 'weihnachtsmarkt-2026-version-a.html';
  var eingebaut = null;
  function eingebauteZeigen() {
    var player = function () { eingebaut = 'player'; zeige('index.html?fernseher=1' + (q.get('pruefen') ? '&pruefen=' + q.get('pruefen') : ''), 'player'); };
    if (eingebaut === 'version-a') { zeige(VERSION_A + '?fernseher=1', 'version-a'); return; }
    if (eingebaut === 'player' || q.get('eingebaut') === 'player') { player(); return; }
    fetch(VERSION_A, { method: 'HEAD', cache: 'no-store' })
      .then(function (a) { if (a.ok) { eingebaut = 'version-a'; zeige(VERSION_A + '?fernseher=1', 'version-a'); } else player(); })
      .catch(player);
  }

  function pruefen() {
    fetch('/kc-kassen-start/tv-programm?nurStand=1', { cache: 'no-store' })
      .then(function (a) { return a.ok ? a.json() : null; })
      .then(function (d) {
        if (d && d.stand) {
          if (String(d.stand) !== stand) { stand = String(d.stand); zeige('/kc-kassen-start/tv-programm?v=' + encodeURIComponent(stand), 'designer'); }
        } else if (herkunft !== 'player' && herkunft !== 'version-a') {
          stand = null; eingebauteZeigen();
        }
      })
      .catch(function () { if (!herkunft) eingebauteZeigen(); });
  }

  var wach = null;
  function wachHalten() { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (w) { wach = w; }).catch(function () {}); } catch (e) { /* */ } }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wachHalten(); });

  window.KCFernsehAnzeige = { herkunft: function () { return herkunft; }, pruefen: pruefen, rahmen: function () { return rahmen[aktiv]; } };
  pruefen(); wachHalten();
  setInterval(pruefen, PRUEFEN_MS);
})();
</script>
</body>
</html>
