<!-- Wertmarke.
     Der Artikel "Wertmarke" benutzte vorher das Bild der Pfand-Komplettrückgabe - auf der
     Kachel stand damit ein Glas mit Zange UND der eingebrannte Preis "4,00 €", obwohl die
     Wertmarke 5,00 € kostet. Ein Preis im Bild geht bei jeder Preisänderung schief; deshalb
     steht hier keiner, nur das Zeichen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Wertmarke">
  <rect width="800" height="520" fill="#f5f3ff"/>
  <g transform="translate(400 260)">
    <circle r="170" fill="#7c3aed"/>
    <circle r="170" fill="none" stroke="#5b21b6" stroke-width="16"/>
    <circle r="130" fill="none" stroke="#ddd6fe" stroke-width="9" stroke-dasharray="15 13"/>
    <!-- Euro-Zeichen gezeichnet, damit es ohne Schriftart auskommt -->
    <g fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round">
      <path d="M62 -56 A72 84 0 1 0 62 56"/>
      <path d="M-88 -22 H30"/>
      <path d="M-88 22 H30"/>
    </g>
  </g>
</svg>
